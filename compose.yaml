services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: pulse
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pulse']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    environment: &env
      DATABASE_URL: postgresql+psycopg://pulse:localdev@db/pulse
      REDIS_URL: redis://redis:6379/0
    command: sh -c 'alembic upgrade head && uvicorn main:app --host 0.0.0.0'
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: ./backend
    environment: *env
    command: celery -A main.celery worker --loglevel=info --concurrency=2
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_started}
  scheduler:
    build: ./backend
    environment: *env
    command: celery -A main.celery beat --loglevel=info
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    build: ./frontend
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
volumes:
  pgdata:
